[project]
name = "sycon-bench"
version = "0.1.0"
description = "SYCON-Bench debate setting — sycophancy evaluation using Inspect AI"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai>=0.3.158",
    "openai",
]

[tool.setuptools]
py-modules = ["sycophancy_eval", "dataset", "scorer"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
